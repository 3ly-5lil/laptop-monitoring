global:
  scrape_interval:     15s # By default, scrape targets every 15 seconds.

  external_labels:
    monitor: 'home-lab-monitor'

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: "process"
    static_configs:
      - targets:
          - "process-exporter:9256"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"

  - job_name: "dcgm"
    static_configs:
      - targets:
          - "dcgm-exporter:9400"

